<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九幽回廊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* VOICE: 阴沉、压抑的地下城，像素小人在石头迷宫里摸黑前进
   IDEA: 一台老式暗黑 RPG 的界面——石板面板、像素角色、迷雾地图
   PICTURE: 迷宫地图与战斗场景是主画面；像素图放大不模糊
   COLOUR and TYPE: 近黑底、血红、暗金；装备品质色（白蓝黄绿橙）；Noto Serif SC 900 标题 + Noto Sans SC
   LAYOUT: 营地两栏，手机单栏；地下城一屏一事 */
:root{color-scheme:dark;--bg:#0b0908;--panel:#15100e;--panel2:#1e1714;--line:#3a2a20;--line2:#5a4030;--ink:#dccbb2;--dim:#9a876f;--blood:#8f1717;--blood2:#c4291f;--gold:#c9a45c;--gold2:#e8c77d;
  --r-normal:#d6d2ca;--r-magic:#8592ff;--r-rare:#f1d34e;--r-set:#3fd157;--r-legend:#e08a35}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.55 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip;min-height:100vh;
  background:radial-gradient(120% 70% at 50% -10%,#3a0f0b 0%,transparent 55%),radial-gradient(100% 60% at 50% 120%,#1a0806 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:"Noto Serif SC",serif;margin:0;line-height:1.1;text-wrap:balance}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:16px max(3vw,12px) 48px}
.top{display:flex;align-items:flex-end;gap:8px 12px;flex-wrap:wrap;margin:8px 0 16px}
.top h1{font-size:clamp(34px,6vw,50px);font-weight:900;color:var(--gold2);letter-spacing:4px;text-shadow:0 2px 0 #000,0 0 22px rgba(196,41,31,.55)}
.top .sub{color:var(--dim);font-size:calc(14px * var(--fs,1));padding-bottom:6px}
.top .rescur{margin-left:auto}
.sub{color:var(--dim);font-size:calc(13px * var(--fs,1))}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border:1px solid var(--line2);border-radius:999px;background:#0e0b0a;font-size:calc(14px * var(--fs,1));white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.gold{color:var(--gold2);border-color:#6b5228}.pill.dim{color:var(--dim)}.pill.dim img{opacity:.4}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:inset 0 0 0 1px #000,0 10px 30px rgba(0,0,0,.4);margin-bottom:14px}
.panel>h3{font-size:calc(19px * var(--fs,1));color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.panel>h3 small,.tbr h3 small,.smith h4 small{font:400 13px "Noto Sans SC",sans-serif;color:var(--dim)}
.sub-h{font-size:calc(16px * var(--fs,1));color:var(--gold);margin:14px 0 8px}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.btn{min-height:44px;padding:0 18px;border-radius:4px;border:1px solid #b8892f;background:linear-gradient(180deg,#a31d18,#6e0f0c);color:#ffe9c4;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,220,160,.25),0 3px 0 #2a0503;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,220,160,.25),0 1px 0 #2a0503}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#120d0b;border-color:var(--line2);color:var(--ink);box-shadow:none;font-weight:500}
.btn.big{min-height:54px;font-size:calc(19px * var(--fs,1));font-family:"Noto Serif SC",serif;letter-spacing:2px;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:calc(14px * var(--fs,1))}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tab{min-height:72px;border:1px solid var(--line);background:#100c0a;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.tab b{font-family:"Noto Serif SC",serif;font-size:calc(15px * var(--fs,1));white-space:nowrap}.tab span{font-size:calc(12px * var(--fs,1));color:var(--dim)}
.tab.on{border-color:var(--gold);background:linear-gradient(180deg,#3a120e,#160c0a);box-shadow:0 0 0 1px #000 inset,0 0 18px rgba(196,41,31,.35)}
.hero-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pedestal{flex:none;width:104px;height:104px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 70%,#4a1610 0%,#1a0806 60%,transparent 72%);position:relative}
.pedestal::after{content:"";position:absolute;bottom:6px;left:18px;right:18px;height:10px;border-radius:50%;background:rgba(0,0,0,.6)}
.pedestal img{position:relative;z-index:1}
.idle{animation:idle 1.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px)}}
.hero-head h2{font-size:calc(30px * var(--fs,1));color:#f1e2c6}
.hero-head p{margin:2px 0 0;color:var(--dim);font-size:calc(14px * var(--fs,1))}
.power{margin-left:auto;text-align:right;flex:none}
.power small{display:block;color:var(--dim);font-size:calc(13px * var(--fs,1))}
.power b{font:900 32px "Noto Serif SC",serif;color:var(--gold2);font-variant-numeric:tabular-nums}
.xp{height:8px;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#6b5228,var(--gold2))}
.lvline{display:flex;justify-content:space-between;font-size:calc(13px * var(--fs,1));color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 12px;margin:12px 0;font-size:calc(14px * var(--fs,1))}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted #2c201a;padding:3px 0}
.stats span{color:var(--dim)}.stats b{font-variant-numeric:tabular-nums;white-space:nowrap}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.dbtn{min-height:56px;border:1px solid var(--line);background:#0e0a09;border-radius:4px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.dbtn small{font-weight:400;font-size:calc(12px * var(--fs,1));color:var(--dim);line-height:1.3;text-align:center}
.dbtn.on{border-color:var(--blood2);background:#2a0c09;color:#ffd9b8}
.dbtn:disabled{opacity:.45;cursor:not-allowed}
.resume{padding:10px 12px;margin:12px 0;border:1px dashed var(--blood2);border-radius:4px;font-size:calc(15px * var(--fs,1))}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.slot{min-height:58px;display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#0d0a09;cursor:pointer}
.slot .g{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);border-radius:3px;font:700 15px "Noto Serif SC",serif;color:var(--dim);background:#070505}
.slot .t{font-size:calc(14px * var(--fs,1));line-height:1.3;overflow:hidden}
.slot .t small{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:calc(12px * var(--fs,1))}
.slot.empty .t{color:#5a4c40}
.r-normal{color:var(--r-normal)}.r-magic{color:var(--r-magic)}.r-rare{color:var(--r-rare)}.r-set{color:var(--r-set)}.r-legend{color:var(--r-legend)}
.slot.b-set{border-color:#1f5a28}.slot.b-legend{border-color:#6a3f17}.slot.b-rare{border-color:#4a4220}
.dots{display:inline-flex;gap:2px;vertical-align:middle}.dots i{width:8px;height:8px;border-radius:50%;border:1px solid #6a5a4a;background:#000}
.skills,.setlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.skills li{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#0d0a09}
.skills li b{font-family:"Noto Serif SC",serif;color:#f1e2c6}
.skills li small{float:right;color:var(--gold);font-size:calc(13px * var(--fs,1))}
.skills li p{margin:2px 0 0;font-size:calc(14px * var(--fs,1));color:var(--dim)}
.skb{color:var(--gold2)}
.skills li.locked{opacity:.45}
.setlist li{padding:8px 10px;border:1px solid #1f3a22;border-radius:4px;background:#0a0f0a;font-size:calc(14px * var(--fs,1))}
.setlist li b{font-family:"Noto Serif SC",serif;color:var(--r-set)}
.setlist .on{color:#9ff0a8}.setlist .off{color:#566656}
.fxlist li{border-color:#4a3a20;background:#120e08}
.tp{font-size:calc(15px * var(--fs,1))}.tp b{font:900 22px "Noto Serif SC",serif;color:var(--dim)}.tp.has b{color:var(--gold2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:#0e0a09;border-radius:999px;cursor:pointer;font-size:calc(14px * var(--fs,1));display:inline-flex;align-items:center;gap:4px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.ilist{display:grid;gap:4px;max-height:560px;overflow:auto;padding-right:4px}
.irow{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;text-align:left;border:1px solid #2a1f19;background:#0d0a09;border-radius:3px;cursor:pointer;width:100%}
.irow:hover{border-color:var(--line2)}
.irow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .nm small,.linkish small{color:var(--dim);font-size:calc(12px * var(--fs,1))}
.irow .sl{font-size:calc(12px * var(--fs,1));color:var(--dim);white-space:nowrap}
.linkish{flex:1;text-align:left;background:none;border:0;cursor:pointer;padding:0;min-height:40px}
.delta{font-size:calc(13px * var(--fs,1));font-variant-numeric:tabular-nums;white-space:nowrap;min-width:48px;text-align:right}
.delta.up{color:#6fe27c}.delta.dn{color:#a8553f}.delta.no{color:#5d4f43}
.empty-note{color:var(--dim);font-size:calc(14px * var(--fs,1));padding:12px;text-align:center;border:1px dashed var(--line);border-radius:4px}
.help-p{font-size:calc(14px * var(--fs,1));color:var(--dim);margin:0 0 10px}
.gems{display:grid;gap:4px}
.gemrow{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #2a1f19;border-radius:3px;background:#0d0a09}
.gemrow .nm{flex:1;font-size:calc(14px * var(--fs,1))}.gemrow .nm small{display:block;color:var(--dim);font-size:calc(12px * var(--fs,1))}
.gamble{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.board{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.board li{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid #2a1f19;border-radius:3px;background:#0d0a09}
.board li.me{border-color:var(--gold)}
.board .rk{width:22px;text-align:center;font:900 16px "Noto Serif SC",serif;color:var(--gold)}
.board .who{flex:1;font-size:calc(15px * var(--fs,1))}.board .who small{display:block;color:var(--dim);font-size:calc(12px * var(--fs,1))}
.board b{font-variant-numeric:tabular-nums;color:var(--gold2)}
details.panel summary{cursor:pointer;color:var(--gold);font-family:"Noto Serif SC",serif;font-size:calc(17px * var(--fs,1))}
textarea{width:100%;min-height:80px;background:#070505;color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:8px;font:13px/1.4 ui-monospace,monospace}
.help{font-size:calc(14px * var(--fs,1));color:var(--dim);margin:8px 0 0;padding-left:20px}
.help li{margin:3px 0}
.warn{font-size:calc(13px * var(--fs,1));color:#e9b77a}
/* 地下城 */
.runbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;background:linear-gradient(180deg,#1f1411,#120c0a);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.rb-hero{display:flex;align-items:center;gap:10px}
.runbar .fl{font:900 19px "Noto Serif SC",serif;color:var(--gold2)}
.runbar .hpw{flex:1 1 200px}
.hpbar{position:relative;height:14px;background:#050303;border:1px solid #3d1a14;border-radius:3px;overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#d1352a,#7b120d);transition:width .25s}
.hpbar .sh{position:absolute;inset:0 auto 0 0;background:rgba(150,190,255,.5)}
.hpbar span{position:relative;display:block;text-align:center;font-size:calc(11px * var(--fs,1));line-height:12px;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hpbar.big{height:22px}.hpbar.big span{font-size:calc(14px * var(--fs,1));line-height:20px}
.buffs{font-size:calc(13px * var(--fs,1));color:#e9b77a;margin:-4px 0 10px;padding:0 4px}
.maphint{text-align:center;color:var(--gold);margin:6px 0 10px;font-size:calc(15px * var(--fs,1))}
.maze{position:relative;width:min(100%,520px,calc((100dvh - 230px) * 5 / 7));aspect-ratio:5/7;margin:0 auto;border:2px solid #2a1d17;border-radius:6px;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0,rgba(0,0,0,.6) 100%),repeating-linear-gradient(45deg,#0a0706 0 6px,#0c0908 6px 12px)}
.cor{position:absolute;background:color-mix(in srgb,var(--bg) 70%,#5a4434);box-shadow:inset 0 0 0 1px #000}
.cor.h{height:22%;height:calc(100% / 7 * .22);transform:translateY(-50%)}
.cor.v{width:calc(100% / 5 * .22);transform:translateX(-50%)}
.room{position:absolute;padding:0;background:none;border:0;cursor:default}
.room .rm{display:grid;place-items:center;position:absolute;inset:13% 11%;border-radius:4px;border:2px solid #3a2a20;
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 8px),color-mix(in srgb,var(--bg) 55%,#4a3a30)}
.room.seen .rm{filter:brightness(.45) saturate(.6);border-style:dashed}
.room.can{cursor:pointer}
.room.can .rm{border-color:#8a6a3a}
.room.can:hover .rm{filter:none;border-color:var(--gold2);box-shadow:0 0 14px rgba(232,199,125,.5)}
.room.seen.can .rm{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(.7) saturate(.8)}}
.room.here .rm{border-color:var(--gold2);box-shadow:0 0 0 2px #000,0 0 18px rgba(232,199,125,.65);background-color:#4a3a2a}
.room.t-boss .rm{border-color:#7a1a14;background-color:#2a0a08}
.room.t-elite .rm{border-color:#b0601f}
.room.t-keeper .rm{border-color:#c9a45c}
.room.t-shop .rm{border-color:#2f6a66}
.room .lockic{position:absolute;right:-4px;bottom:-4px}
.elite-ic{filter:drop-shadow(0 0 3px #ff8a2a)}
.glow{filter:drop-shadow(0 0 6px #f1c94a)}
.me{animation:idle 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px #000)}
.ash{width:20px;height:6px;border-radius:50%;background:#2a201a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:calc(13px * var(--fs,1));color:var(--dim);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .eb{width:14px;height:14px;border:2px solid #b0601f;border-radius:3px}
.arena{position:relative;display:grid;gap:14px;padding:16px 10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 35%,transparent 65%,rgba(0,0,0,.6)),repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,transparent 2px 56px),color-mix(in srgb,var(--bg) 70%,#3a2a20)}
.side{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;min-height:120px}
.unit{position:relative;width:132px;padding:6px 6px 8px;border:1px solid transparent;border-radius:4px;transition:opacity .4s,filter .4s;display:flex;flex-direction:column;align-items:center;text-align:center}
.unit .sp{height:auto;display:grid;place-items:end center;margin-bottom:2px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit .un{font:700 13px "Noto Serif SC",serif;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.unit .un small{font:400 11px "Noto Sans SC";color:var(--dim)}
.unit .hpbar{width:100%}
.unit .tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;justify-content:center}
.unit .tags span{font-size:calc(11px * var(--fs,1));padding:0 5px;border-radius:2px;background:#3a1a0c;color:#ffb066}
.unit .sts{min-height:15px;font-size:calc(11px * var(--fs,1));margin-top:3px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.unit .sts span{padding:0 4px;border-radius:2px;background:rgba(0,0,0,.6)}
.unit.k-elite .un{color:#ffa552}.unit.k-elite .sp{filter:drop-shadow(0 0 6px #ff8a2a) drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.k-boss{width:min(300px,100%)}.unit.k-boss .un{color:#ffcfa8;font-size:calc(18px * var(--fs,1))}.unit.k-boss .sp{filter:drop-shadow(0 0 10px #c4291f) drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.unit.k-hero{width:min(320px,100%);background:rgba(20,12,8,.6);border-color:#5a4030}.unit.k-hero .un{color:var(--gold2);font-size:calc(16px * var(--fs,1))}
.unit.k-minion{width:96px}.unit.k-minion .un{font-size:calc(12px * var(--fs,1));color:#c9c0b0}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.frozen .sp{filter:drop-shadow(0 0 6px #8fd0ff) hue-rotate(160deg) saturate(.6)}
.unit.spawn{animation:spawn .4s ease-out}
.unit.die .sp{animation:die .5s ease-in forwards}
.unit.lunge-u .sp{animation:lu .3s ease-out}
.unit.lunge-d .sp{animation:ld .3s ease-out}
.unit.hurt .sp{animation:hurt .3s ease-out}
@keyframes spawn{from{opacity:0;transform:translateY(-10px) scale(.8)}}
@keyframes die{to{transform:translateY(10px) rotate(-12deg) scale(.85);opacity:.3}}
@keyframes lu{40%{transform:translateY(-18px) scale(1.06)}}
@keyframes ld{40%{transform:translateY(18px) scale(1.06)}}
@keyframes hurt{20%{transform:translateX(-5px);filter:brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(5)}60%{transform:translateX(5px)}}
.cds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center}
.cds span{font-size:calc(11px * var(--fs,1));padding:1px 6px;border:1px solid var(--line2);border-radius:2px;color:#e7d6ba;background:#0d0a09}
.cds span.cd{color:#6b5a4a;border-color:#2a201a}
.pop{position:absolute;left:50%;top:22%;pointer-events:none;font:900 19px "Noto Serif SC",serif;color:#fff;text-shadow:0 2px 2px #000,0 0 4px #000;white-space:nowrap;animation:pop .9s ease-out forwards;z-index:3}
.pop.crit{color:#ffd23a;font-size:calc(25px * var(--fs,1))}.pop.fire,.pop.burn{color:#ff7a3a}.pop.cold{color:#8fd0ff}.pop.light{color:#fff59a}.pop.magic{color:#c7a8ff}.pop.holy{color:#fff2b0}
.pop.poison{color:#7fe05a}.pop.heal{color:#5df07a}.pop.miss{color:#aaa;font-size:calc(15px * var(--fs,1))}.pop.thorn{color:#d8a0a0;font-size:calc(14px * var(--fs,1))}.pop.buff,.pop.curse{color:#ffb066;font-size:calc(15px * var(--fs,1))}

@keyframes bell{0%{transform:translate(-50%,-50%) rotate(0);opacity:0}10%{opacity:1}25%{transform:translate(-50%,-50%) rotate(25deg)}45%{transform:translate(-50%,-50%) rotate(-25deg)}65%{transform:translate(-50%,-50%) rotate(15deg)}85%{transform:translate(-50%,-50%) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-50%) rotate(0);opacity:0}}
.goldbell{width:130px;height:140px;border:3px solid var(--c);border-radius:48% 48% 14px 14px;background:linear-gradient(180deg,rgba(255,215,90,.3),rgba(255,215,90,.08));box-shadow:0 0 24px var(--c),inset 0 0 20px rgba(255,215,90,.5);animation-name:gbell}
.goldbell::before{content:"";position:absolute;left:8%;right:8%;top:40%;height:3px;background:var(--c);box-shadow:0 14px 0 var(--c)}
@keyframes gbell{0%{transform:translate(-50%,-140%) scale(.8);opacity:0}25%{transform:translate(-50%,-50%) scale(1.04);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:.9}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
.palm{width:70px;height:70px;border-radius:40% 40% 30% 30%;background:radial-gradient(circle at 50% 60%,#fff 0 15%,var(--c) 40%,transparent 70%);
  -webkit-mask:linear-gradient(#000,#000);filter:drop-shadow(0 0 10px var(--c));animation-name:boom}
.sutra{font:400 26px/1 "Ma Shan Zheng",serif;color:#ffd75a;text-shadow:0 0 10px #ffb02a;animation-name:sutra;animation-delay:var(--dl,0ms);opacity:0}
@keyframes sutra{0%{transform:translate(-50%,-30%);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-180%);opacity:0}}
.swastika{font:900 220px/1 "Noto Serif SC",serif;color:transparent;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,215,90,.35),transparent 65%);animation-name:swa}
@keyframes swa{from{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}to{transform:translate(-50%,-50%) scale(1.3) rotate(90deg);opacity:0}}
.sprfx.stick{animation-name:stick}
@keyframes stick{0%{transform:translate(-50%,-120%) rotate(-30deg);opacity:0}25%{transform:translate(-50%,-50%) rotate(-8deg);opacity:1}80%{opacity:1}100%{opacity:0}}
.sprfx.sweep{animation-name:sweep;animation-timing-function:linear;animation-delay:var(--dl,0ms);opacity:0}
.sprfx.sweep img{filter:drop-shadow(0 0 8px #5df0c0);opacity:.85}
@keyframes sweep{0%{transform:translate(-50%,-50%);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-60%);opacity:0}}
.wash{inset:0;left:0!important;top:0!important;transform:none;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--c) 75%,transparent),transparent 75%);animation-name:wash;z-index:0}
@keyframes wash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.arena{background-blend-mode:normal}

/* ===== 九幽回廊：中式暗黑 ===== */
.top h1,#banner h2,.credits .cr-line b,.chap .ct b,.dlg-name,.pagebig h2,.res h3{font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-weight:400}
.top h1{letter-spacing:6px;font-size:clamp(40px,7vw,60px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
  background:radial-gradient(ellipse at 20% 0%,#c4291f 0,transparent 40%),radial-gradient(ellipse at 90% 100%,#c9a45c 0,transparent 45%)}
.wrap{position:relative;z-index:1}
.panel{background-image:linear-gradient(180deg,rgba(196,41,31,.05),transparent 40%)}
.panel>h3::before{content:"";width:4px;height:18px;background:var(--blood2);border-radius:1px;flex:none}
/* 青石镇 */
.camp{position:relative;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:26px 10px 8px;overflow:hidden;
  background:linear-gradient(180deg,#1a0d0b,#0d0908 70%),#0d0908}
.camp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#1f1814 0 38px,#16110e 38px 40px);border-top:1px solid #2a2018}
.lanterns{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}
.lanterns i{width:16px;height:22px;margin-top:4px;border-radius:7px;background:radial-gradient(circle at 50% 40%,#ff8a3a,#c4291f 60%,#6a0e0a);box-shadow:0 0 18px 4px rgba(255,90,40,.35);animation:sway 3s ease-in-out infinite;transform-origin:50% -10px}
.lanterns i:nth-child(2){animation-delay:-1s}.lanterns i:nth-child(3){animation-delay:-2s}
@keyframes sway{50%{transform:rotate(6deg)}}
.npcs{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,3vw,26px);flex-wrap:wrap}
.npc{position:relative;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px;min-width:64px}
.npc b{font:400 13px "Noto Serif SC",serif;color:var(--gold);margin-top:2px;padding:0 6px;background:rgba(0,0,0,.6);border-radius:2px}
.npc.ngoc b{color:#ffb3c8}
.npc:hover img{filter:brightness(1.25)}
.npc.talk img{animation:hop .4s}
@keyframes hop{40%{transform:translateY(-8px)}}
.npc .svc-tag{display:block;margin-top:2px;font-size:calc(10px * var(--fs,1));color:#9bd8b0;background:rgba(0,0,0,.6);border-radius:2px;padding:0 4px;white-space:nowrap}
.svc-head{display:flex;align-items:center;gap:10px;margin:6px 0 10px;padding:8px;border:1px solid var(--line);border-radius:4px;background:#100b09}
.svc-head b{color:var(--gold2);font-size:calc(16px * var(--fs,1))}.svc-head p{margin:2px 0 0;font-size:calc(13px * var(--fs,1));color:var(--dim);line-height:1.5}
.svc-list{display:flex;flex-direction:column;gap:5px;max-height:52vh;overflow:auto}
.svc-row{display:flex;align-items:center;gap:8px;min-height:48px;padding:3px 8px;border:1px solid #2a1f19;background:#0d0a09;border-radius:4px;cursor:pointer;text-align:left}
.svc-row .nm,.svc-it .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-row .nm small,.svc-it .nm small{color:var(--dim);font-size:calc(12px * var(--fs,1))}.svc-row em{flex:none;font-style:normal;font-size:calc(12px * var(--fs,1));color:var(--gold)}
.svc-it{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.svc-go{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px}.svc-slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.svc-res{margin-top:8px;text-align:center}
.bulk .seg{margin-bottom:6px}.bulk .chips{display:flex;flex-wrap:wrap;gap:6px}.bulk-sum{margin:10px 0 6px;padding:8px;border:1px solid var(--line);border-radius:4px;text-align:center;background:#100b09}
.bulk-sum b{color:var(--gold2)}.bulk-sum small{display:block;color:var(--dim);font-size:calc(12px * var(--fs,1));margin-top:2px}
.bulk-list{display:flex;flex-wrap:wrap;gap:5px;max-height:34vh;overflow:auto;margin-bottom:10px}.bulk-list .lchip{min-height:34px;padding:2px 8px;font-size:calc(13px * var(--fs,1))}
.lchip.off{opacity:.35;text-decoration:line-through}.chip.bulkc{border-color:#5a8a6a;color:#9bd8b0}.ilock{margin-top:6px;font-size:calc(12px * var(--fs,1));color:#9bd8b0}
.camp-hint{position:relative;z-index:1;text-align:center;margin:6px 0 0;font-size:calc(12px * var(--fs,1));color:var(--dim)}
.bubble{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);z-index:20;width:max-content;max-width:min(240px,70vw);padding:7px 11px;
  background:#f1e6d0;color:#2a160e;border-radius:6px;font:500 13px/1.45 "Noto Sans SC",sans-serif;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.5);animation:bub .25s ease-out;pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#f1e6d0}
@keyframes bub{from{opacity:0;transform:translate(-50%,6px) scale(.9)}}
.unit .bubble{bottom:auto;top:-6px;transform:translate(-50%,-100%);animation:bub2 .25s ease-out}
#foes .unit .bubble{top:auto;bottom:-8px;transform:translate(-50%,100%);animation:bub3 .25s ease-out}
#foes .unit .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#f1e6d0}
@keyframes bub3{from{opacity:0;transform:translate(-50%,90%) scale(.9)}}
@keyframes bub2{from{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
/* 章节 */
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin:4px 0 12px}
.chap{display:flex;align-items:center;gap:10px;min-height:64px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:#0e0a09;cursor:pointer;text-align:left}
.chap.on{border-color:var(--blood2);background:linear-gradient(90deg,#2a0c09,#120a08)}
.chap.locked{opacity:.4;cursor:not-allowed}
.cimg{flex:none;width:48px;display:grid;place-items:center}
.ct{flex:1;display:flex;flex-direction:column}.ct .cn{color:var(--gold);font-size:calc(12px * var(--fs,1));letter-spacing:2px}.ct b{font-size:calc(24px * var(--fs,1));color:#f1e2c6;line-height:1.1}.ct small{font-size:calc(12px * var(--fs,1));color:var(--dim);line-height:1.35}
.cs{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.cs em{font-style:normal;font-size:calc(12px * var(--fs,1));color:#6fe27c}.cs em.new{color:var(--gold2)}.cs small{font-size:calc(11px * var(--fs,1));color:var(--dim)}
.locknote{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--line2);border-radius:4px;color:var(--dim);font-size:calc(14px * var(--fs,1))}
.ngoc-toggle{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:#0e0a09;cursor:pointer;text-align:left}
.ngoc-toggle span{display:flex;flex-direction:column}.ngoc-toggle small{color:var(--dim);font-size:calc(12px * var(--fs,1))}
.ngoc-toggle.on{border-color:#ff8fb0;background:#1e0c12}.ngoc-toggle:not(.on) img{filter:grayscale(1) brightness(.6)}
/* 对话 */
#dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75));cursor:pointer}
#dlg[hidden]{display:none}
.dlg-box{position:relative;width:min(760px,100%);display:flex;gap:14px;align-items:flex-end;padding:14px 16px;border:1px solid #8a6a3a;border-radius:6px;
  background:linear-gradient(180deg,#1d1310,#120c0a);box-shadow:0 0 0 3px #0b0807,0 0 0 4px #5a4030,0 10px 40px rgba(0,0,0,.8);animation:dlgin .25s ease-out}
@keyframes dlgin{from{opacity:0;transform:translateY(16px)}}
.dlg-por{flex:none;width:84px;height:84px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:4px;background:radial-gradient(circle at 50% 70%,#3a1410,#0e0806)}
#dlg.narr .dlg-por{display:none}
#dlg.right .dlg-box{flex-direction:row-reverse}#dlg.right .dlg-name{text-align:right}
.dlg-body{flex:1;min-height:84px;display:flex;flex-direction:column}
.dlg-name{font-size:calc(24px * var(--fs,1));color:var(--gold2);line-height:1.1;min-height:4px}
.dlg-text{flex:1;font-size:calc(17px * var(--fs,1));line-height:1.65;color:#f1e6d0;margin-top:4px;white-space:pre-wrap}
#dlg.narr .dlg-text{font-family:"Noto Serif SC",serif;color:#c9b89a;font-style:normal;text-align:center;padding:6px 0}
.dlg-foot{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:calc(12px * var(--fs,1));color:var(--dim)}
.dlg-tap{margin-left:auto;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.dlg-skip{min-height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:3px;background:#0e0a09;color:var(--ink);cursor:pointer;font-size:calc(12px * var(--fs,1))}
/* 章节标题 */
#banner{position:fixed;left:0;right:0;top:32%;z-index:55;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:ban 2.2s ease-in-out forwards}
#banner h2{display:inline-block;font-size:clamp(40px,9vw,72px);color:#f1e2c6;padding:6px 40px;text-shadow:0 0 24px rgba(196,41,31,.9),0 3px 0 #000;
  background:linear-gradient(90deg,transparent,rgba(10,5,4,.85) 20%,rgba(10,5,4,.85) 80%,transparent)}
#banner p{margin:4px 0 0;color:var(--gold);font-size:calc(15px * var(--fs,1));text-shadow:0 2px 4px #000}
@keyframes ban{0%{opacity:0;transform:scale(1.25);filter:blur(6px)}15%{opacity:1;transform:none;filter:none}80%{opacity:1}100%{opacity:0}}
/* 战斗：Ngoc 与首领变身 */
.allies:has(.k-ally) .k-hero{width:min(230px,60%)}
.unit.k-ally{width:min(150px,36%);background:rgba(40,12,20,.5);border-color:#6a3040}.unit.k-ally .un{color:#ffb3c8}
.unit.k-ally .sp{filter:drop-shadow(0 0 6px rgba(255,140,180,.5)) drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.unit.retreat .sp{animation:retreat .6s ease-in forwards}
@keyframes retreat{to{transform:translateX(-40px);opacity:.3}}
.unit.phase .sp{animation:phase .8s ease-out}
@keyframes phase{0%{filter:brightness(4) saturate(0)}30%{transform:scale(1.25)}100%{transform:none}}
.unit.k-boss.rare .un{color:#ff9a5a}
/* 残卷 / 剧情回顾 / 结算 */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pagec{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#0e0a09;font-size:calc(13px * var(--fs,1));color:var(--dim)}
.pagec b{font-family:"Noto Serif SC",serif;color:var(--dim)}.pagec p{margin:4px 0 0;line-height:1.5}
.pagec.got{background:#1a140c;border-color:#5a4a2a;color:#d8c8a0}.pagec.got b{color:var(--gold2)}
.rp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.rp b{min-width:9em;font-family:"Noto Serif SC",serif;color:var(--gold);font-size:calc(14px * var(--fs,1))}
.firstclear,.lgup{margin:12px 0;padding:12px;border:1px solid #5a4a2a;border-radius:4px;background:#17110a}
.firstclear h3,.lgup h3{color:var(--gold2);font-size:calc(18px * var(--fs,1));margin-bottom:6px}
.pagebig{text-align:center}.pagebig h2{font-size:calc(34px * var(--fs,1));color:var(--gold2);margin:6px 0}
.pagebig p{font-family:"Noto Serif SC",serif;font-size:calc(17px * var(--fs,1));line-height:1.8;color:#e8d8b8;margin:8px auto;max-width:30em}
.pagebig small{color:#6fe27c}
.res h3{font-size:calc(44px * var(--fs,1));line-height:1}.res.win h3{color:var(--gold2)}.res.lose h3{color:var(--blood2)}
/* 片尾 */
.credits{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:30px 10px}
.cr-art{display:flex;gap:10px;align-items:flex-end}
.cr-roll{display:flex;flex-direction:column;gap:14px}
.cr-line{opacity:0;animation:crin .8s ease-out forwards}
.cr-line small{display:block;color:var(--dim);font-size:calc(13px * var(--fs,1));letter-spacing:4px}.cr-line b{font-size:calc(28px * var(--fs,1));color:#f1e2c6}
.cr-line:first-child b{font-size:calc(52px * var(--fs,1));color:var(--gold2);letter-spacing:10px}
.cr-line:last-child b{font-size:calc(22px * var(--fs,1));color:var(--gold)}
.cr-line:nth-child(1){animation-delay:0.30s}.cr-line:nth-child(2){animation-delay:1.05s}.cr-line:nth-child(3){animation-delay:1.80s}.cr-line:nth-child(4){animation-delay:2.55s}.cr-line:nth-child(5){animation-delay:3.30s}.cr-line:nth-child(6){animation-delay:4.05s}.cr-line:nth-child(7){animation-delay:4.80s}.cr-line:nth-child(8){animation-delay:5.55s}.cr-line:nth-child(9){animation-delay:6.30s}.cr-line:nth-child(10){animation-delay:7.05s}
.cr-unlock{color:var(--ink);font-size:calc(15px * var(--fs,1));opacity:0;animation:crin .8s ease-out 8s forwards}
.credits .btn{max-width:420px;opacity:0;animation:crin .8s ease-out 8.5s forwards}
@keyframes crin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:560px){.dlg-por{width:64px;height:64px}.dlg-por img{width:56px;height:56px}.dlg-text{font-size:calc(15px * var(--fs,1))}.dlg-name{font-size:calc(20px * var(--fs,1))}.chapters{grid-template-columns:1fr}}

/* ===== 装备页：一屏完成 ===== */
.gdoll{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.gsb{position:relative;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;border:1px solid var(--line);border-radius:5px;background:#0d0a09;cursor:pointer}
.gsb .gi{width:42px;height:42px;display:grid;place-items:center;border-radius:3px;background:#070505}
.gsb .gi i{font:700 16px "Noto Serif SC",serif;color:#4a3c30;font-style:normal}
.gsb .gn{font-size:calc(12px * var(--fs,1));color:var(--dim);white-space:nowrap}
.gsb em{position:absolute;top:-6px;right:-4px;font:700 11px/1 "Noto Sans SC";font-style:normal;color:#0b1a0c;background:#6fe27c;border-radius:9px;padding:3px 5px;box-shadow:0 0 8px rgba(111,226,124,.6)}
.gsb.locked{opacity:.5;cursor:default;border-style:dashed}.gsb.locked small{font-size:calc(10px * var(--fs,1));color:var(--dim);white-space:nowrap}
.gemrow.empty{opacity:.6}.newslot{margin-top:6px;color:#6fe27c}.newslot b{color:var(--gold2)}
.gsb.on{border-color:var(--gold2);background:#24170e;box-shadow:0 0 0 1px var(--gold2)}
.gsb.on .gn{color:var(--gold2)}
.gsb.b-set{border-color:#1f5a28}.gsb.b-legend{border-color:#6a3f17}.gsb.b-rare{border-color:#4a4220}.gsb.b-magic{border-color:#2a3060}
.gsb.on.b-set,.gsb.on.b-legend,.gsb.on.b-rare,.gsb.on.b-magic{border-color:var(--gold2)}
.gbar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:10px 0 8px}
.upn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#6fe27c;color:#0b1a0c;font-size:calc(12px * var(--fs,1))}
.gsubs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:5px;overflow:hidden}
.gsubs button{min-height:40px;border:0;border-right:1px solid var(--line);background:#0d0a09;color:var(--dim);cursor:pointer;font:700 14px "Noto Serif SC",serif;white-space:nowrap}
.gsubs button:last-child{border-right:0}
.gsubs button.on{background:#2a0c09;color:var(--gold2)}
.gbody{padding-top:10px}
.gcur2{padding:8px 10px;margin-bottom:8px;border:1px solid var(--line2);border-radius:6px;background:#110c0a}
.gcur-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}.gcur-h .sub{flex:1;min-width:0}
.gcur-t{margin:10px 0 6px}
.mech{padding:8px 10px;margin-bottom:10px;border:1px solid #5a4a2a;border-radius:6px;background:rgba(212,175,55,.05)}.mech .sub-h{margin:0 0 6px}.mech .help-p{margin:0 0 6px}.mech .help-p:last-child{margin-bottom:0}
.wxb{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;box-sizing:border-box;white-space:nowrap;margin-right:4px;border-radius:4px;background:var(--c);color:#120a08;font:400 13px/1 "Ma Shan Zheng",serif;font-style:normal;vertical-align:-2px}.wxb.off{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1px var(--c);opacity:.55}
.wxrow span{margin:0 3px;color:var(--dim)}.wxrow .warn{color:#e8a23a}.wxrow .ok{color:#6fe27c}
.skboost{margin-top:5px;padding:5px 7px;border-left:2px solid #6a5a2a;background:rgba(212,175,55,.05);font-size:calc(12px * var(--fs,1));line-height:1.45;color:var(--dim)}.skboost b{margin-right:5px}.skboost .tl{color:var(--gold2)}
.gcur{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;border:1px dashed var(--line2);border-radius:4px;background:#110c0a}
.gcur .linkish{display:inline-flex;align-items:center;gap:4px;flex:1;min-width:0}

.hs-grid .skb2{min-width:0;height:34px;min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
.hs-grid .skb2 i{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.unit.k-ward .bubble{left:-6px;transform:translate(0,-100%);animation:none}.unit.k-ward .bubble::after{left:30px}
.mz-bar{position:relative;height:34px;border:1px solid #8a6a3a;border-radius:6px;background:linear-gradient(90deg,#3a0a06,#8a1a0a 40%,#5a1206);overflow:hidden}
.mz-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#e8801a,#ffc04a,#e8801a);box-shadow:0 0 10px #ff9a2a}
.mz-pt{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff}
.mz-or{color:#ffb040;font-weight:700}.mz-go{text-align:center;font-size:calc(20px * var(--fs,1))}
.foods{display:flex;flex-direction:column;gap:6px;margin:8px 0}.foods .dis{opacity:.45}

/* ---------- 主页面 ---------- */
body[data-view=title] .wrap{max-width:none;padding:0}
.title{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;padding:0 20px max(28px,env(safe-area-inset-bottom))}
.tl-sky{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 22%,#3a1410 0%,#1a0a08 45%,#070504 100%);pointer-events:none}
.tl-moon{position:absolute;left:50%;top:9%;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff3d6,#e9c98a 55%,#b58a4a);box-shadow:0 0 60px 18px rgba(255,200,120,.18),0 0 160px 60px rgba(196,41,31,.18);opacity:.92;animation:tlMoon 9s ease-in-out infinite alternate}
@keyframes tlMoon{to{transform:translateY(8px);box-shadow:0 0 80px 24px rgba(255,200,120,.24),0 0 180px 70px rgba(196,41,31,.22)}}
.tl-mtn{position:absolute;left:-10%;right:-10%;bottom:30%;height:34%;background:#140a09;clip-path:polygon(0 100%,0 60%,8% 42%,16% 55%,27% 22%,36% 40%,45% 30%,55% 52%,64% 18%,74% 44%,84% 32%,93% 50%,100% 38%,100% 100%)}
.tl-mtn.b{bottom:22%;height:30%;background:#0c0605;clip-path:polygon(0 100%,0 55%,10% 62%,22% 40%,33% 58%,47% 36%,58% 60%,70% 44%,82% 64%,92% 46%,100% 58%,100% 100%)}
.tl-town{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#060403,#030202);clip-path:polygon(0 30%,6% 30%,6% 18%,9% 10%,12% 18%,12% 30%,20% 30%,20% 22%,30% 22%,30% 30%,40% 30%,40% 14%,44% 6%,48% 14%,48% 30%,60% 30%,60% 20%,70% 20%,70% 30%,78% 30%,78% 16%,82% 9%,86% 16%,86% 30%,100% 30%,100% 100%,0 100%)}
.tl-town::after{content:"";position:absolute;inset:0;background:radial-gradient(4px 4px at 10% 34%,#ffb04a,transparent),radial-gradient(4px 4px at 44% 20%,#ffb04a,transparent),radial-gradient(4px 4px at 65% 32%,#ff8a3a,transparent),radial-gradient(4px 4px at 82% 24%,#ffb04a,transparent);animation:tlLamp 2.4s ease-in-out infinite alternate}
@keyframes tlLamp{from{opacity:.55}to{opacity:1}}
.tl-fog{position:absolute;left:-50%;width:200%;height:26%;bottom:18%;background:radial-gradient(40% 50% at 30% 50%,rgba(150,140,130,.14),transparent 70%),radial-gradient(35% 45% at 70% 60%,rgba(150,140,130,.1),transparent 70%);animation:tlFog 38s linear infinite}
.tl-fog.b{bottom:6%;opacity:.8;animation-duration:26s;animation-direction:reverse}
@keyframes tlFog{to{transform:translateX(25%)}}
.tl-emb{position:absolute;left:var(--x);bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#7affd0;box-shadow:0 0 8px 2px rgba(93,240,192,.6);opacity:0;animation:tlEmb var(--d) linear var(--dl) infinite}
.tl-emb:nth-child(3n){background:#ffb04a;box-shadow:0 0 8px 2px rgba(255,140,60,.6)}
@keyframes tlEmb{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(30px,-70vh)}}
.tl-head{position:absolute;top:30%;left:0;right:0;text-align:center;animation:tlIn 1.6s ease-out both}
.tl-head h1{font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-weight:400;font-size:clamp(64px,19vw,120px);color:#f4dcae;letter-spacing:6px;line-height:1;text-shadow:0 4px 0 #000,0 0 30px rgba(196,41,31,.8),0 0 4px #000}
.tl-head p{margin:14px 0 0;color:#c9b08a;font-family:"Noto Serif SC",serif;letter-spacing:3px;font-size:calc(15px * var(--fs,1));text-shadow:0 2px 4px #000}
@keyframes tlIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.tl-menu{position:relative;width:min(360px,100%);display:flex;flex-direction:column;gap:10px;animation:tlIn 1.2s .5s ease-out both}
.tl-menu .btn.big{flex-direction:column;gap:2px;min-height:62px}
.tl-menu .btn.big small{font-size:calc(12px * var(--fs,1));font-family:"Noto Sans SC",sans-serif;letter-spacing:0;font-weight:500;opacity:.85}
.tl-menu>.btn.ghost{width:100%}
.tl-row{display:flex;gap:8px}.tl-row .btn{flex:1;padding:0 6px}
.cr-sign{margin:22px 0 0;color:#7a6a58;font-size:calc(12px * var(--fs,1));letter-spacing:3px;opacity:0;animation:crin .8s 10s ease-out forwards}
.tl-lang{position:relative;margin:6px 0 0;font-size:calc(12px * var(--fs,1));color:#6b5a4a}.tl-lang a{cursor:pointer;color:#8a7660;padding:2px 4px}.tl-lang a.on{color:#d8b878;text-decoration:underline}
.tl-sign{position:relative;margin:14px 0 0;color:#8a7660;font-family:"Noto Serif SC",serif;letter-spacing:2px;font-size:calc(12px * var(--fs,1))}
.tl-foot{position:relative;margin:14px 0 0;color:#6a5a48;font-size:calc(12px * var(--fs,1))}
.homeb{align-self:center;margin-right:4px;white-space:nowrap;padding:0 10px}
/* ---------- 开章小动画 ---------- */
.chint{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:#050302;animation:ciIn .35s ease-out both;cursor:pointer;overflow:hidden}
.chint.out{animation:ciOut .45s ease-in both}
@keyframes ciIn{from{opacity:0}}@keyframes ciOut{to{opacity:0}}
.ci-ink{position:absolute;inset:-20%;background:radial-gradient(45% 35% at 50% 50%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),radial-gradient(70% 50% at 50% 55%,rgba(60,15,10,.7),transparent 75%);animation:ciInk 4.6s ease-out both}
@keyframes ciInk{from{transform:scale(.6);opacity:0}30%{opacity:1}to{transform:scale(1.1);opacity:.9}}
.ci-emb i{position:absolute;left:var(--x);bottom:-8px;width:3px;height:3px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px 2px var(--ac);opacity:0;animation:tlEmb var(--d) linear var(--dl) infinite}
.ci-box{position:relative;text-align:center;padding:0 24px}
.ci-no{color:#c9b08a;font-family:"Noto Serif SC",serif;letter-spacing:8px;font-size:calc(18px * var(--fs,1));opacity:0;animation:ciUp .6s .25s ease-out both}
.ci-name{font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-size:clamp(60px,18vw,104px);color:#f6e2b8;line-height:1.15;margin:6px 0 2px;text-shadow:0 4px 0 #000,0 0 26px color-mix(in srgb,var(--ac) 70%,transparent);clip-path:inset(0 100% 0 0);animation:ciBrush .9s .6s cubic-bezier(.6,0,.3,1) both}
@keyframes ciBrush{to{clip-path:inset(0 -10% 0 0)}}
@keyframes ciUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ci-theme{height:96px;display:flex;align-items:center;justify-content:center}
.ci-theme span{display:inline-block;padding:6px 12px;border:3px solid #d6311f;border-radius:6px;color:#e8402c;font-family:"Ma Shan Zheng","Noto Serif SC",serif;font-size:clamp(34px,10vw,54px);line-height:1.1;background:rgba(214,49,31,.08);box-shadow:0 0 0 2px rgba(214,49,31,.25) inset;opacity:0;transform:scale(2.6) rotate(-8deg);animation:ciSeal .35s 1.7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ciSeal{to{opacity:1;transform:scale(1) rotate(-4deg)}}
.ci-sub{color:#bfa888;font-family:"Noto Serif SC",serif;letter-spacing:2px;font-size:calc(15px * var(--fs,1));max-width:22em;margin:6px auto 0;opacity:0;animation:ciUp .8s 2.3s ease-out both}
.ci-skip{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#5a4a3a;font-size:12px;animation:ciUp .5s 1s both}
.chint.shake .ci-box{animation:ciShake .25s}

/* ---------- 全章大地图 ---------- */
.mtabs{justify-content:center;margin:6px 0 10px}
.rgn{display:block;max-width:420px;margin:0 auto;font-family:"Noto Serif SC",serif}
.rg-e{stroke:#5a4030;stroke-width:2;stroke-dasharray:4 4}
.rg-n rect{fill:#1e1714;stroke:#5a4030;stroke-width:1.5}
.rg-n text{fill:#dccbb2;font-size:12px;text-anchor:middle}
.rg-n.unk rect{fill:#0f0b0a;stroke-dasharray:3 3}.rg-n.unk text{fill:#6a5a48}
.rg-n.lit{cursor:pointer}.rg-n.lit rect{stroke:#c9a45c}
.rg-n.lit:active rect{fill:#3a2a20}
.rg-n.here rect{stroke:#ffd75a;stroke-width:2.5;fill:#2a1c12}
.rg-n .rg-f{font-size:11px;text-anchor:start}
.rg-n .rg-m{fill:#ffd75a;font-size:14px}.rg-n .rg-s{fill:#8fe89a;font-size:11px}
.rg-n .rg-h{fill:#ffd75a;font-size:10px}

/* ---------- 战斗：状态挂在身上 ---------- */
.unit .aura{position:absolute;left:50%;top:6px;width:var(--sz,48px);height:var(--sz,48px);margin-left:calc(var(--sz,48px) / -2);pointer-events:none;z-index:2}
.unit .aura>i{position:absolute;inset:0;display:none}
.unit.st-burn .a-fire,.unit.st-tox .a-tox,.unit.st-ice .a-ice,.unit.st-stun .a-stun,.unit.st-shd .a-shd,.unit.st-rage .a-rage,.unit.st-cur .a-cur{display:block}
/* 灼烧：火苗从脚下往上窜，身子发红，冒黑烟和火星 */
.a-fire::before{content:"";position:absolute;left:8%;right:8%;bottom:-4%;height:70%;background:radial-gradient(28% 60% at 25% 100%,#ffcf4a 0,#ff7a1a 45%,transparent 72%),radial-gradient(26% 75% at 55% 100%,#fff0a0 0,#ff8a1a 40%,transparent 70%),radial-gradient(24% 55% at 82% 100%,#ffb02a 0,#e8401a 50%,transparent 74%);mix-blend-mode:screen;filter:blur(1px);transform-origin:50% 100%;animation:fFlick .32s steps(2) infinite alternate}
.a-fire::after{content:"";position:absolute;left:50%;bottom:30%;width:3px;height:3px;border-radius:50%;background:#ffcf6a;box-shadow:-10px -6px 0 0 #ff9a3a,12px -14px 0 0 #ffcf6a,-4px -22px 0 0 #ff7a2a,8px -30px 0 1px rgba(40,30,26,.7),-12px -38px 0 2px rgba(30,24,20,.55);animation:fRise 1.1s linear infinite}
@keyframes fFlick{from{transform:scaleY(.82) skewX(-3deg)}to{transform:scaleY(1.12) skewX(3deg)}}
@keyframes fRise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.unit.st-burn .sp{animation:burnTint .5s ease-in-out infinite alternate}
@keyframes burnTint{from{filter:drop-shadow(0 0 6px #ff6a1a) sepia(.5) saturate(2) hue-rotate(-20deg) brightness(1)}to{filter:drop-shadow(0 0 12px #ff9a2a) sepia(.7) saturate(2.6) hue-rotate(-25deg) brightness(1.15)}}
.unit.flare .a-fire::before{animation:fFlare .45s ease-out}
@keyframes fFlare{0%{transform:scaleY(1)}35%{transform:scaleY(1.9) scaleX(1.15)}100%{transform:scaleY(1)}}
/* 中毒：泛绿、冒泡、往下滴 */
.unit.st-tox .sp{filter:drop-shadow(0 0 6px #6ae03a) sepia(.6) hue-rotate(50deg) saturate(1.8)}
.a-tox::before{content:"";position:absolute;left:50%;top:30%;width:6px;height:6px;border-radius:50%;border:1.5px solid #9aff6a;box-shadow:-14px 10px 0 -1px #6ae03a,12px 4px 0 -2px #9aff6a,4px 16px 0 -1px #6ae03a;animation:tBub 1.4s ease-in infinite}
.a-tox::after{content:"";position:absolute;left:62%;top:62%;width:4px;height:7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7fe05a;animation:tDrip 1.2s ease-in infinite}
@keyframes tBub{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-26px);opacity:0}}
@keyframes tDrip{0%{transform:translateY(0) scaleY(.5);opacity:0}20%{opacity:1}100%{transform:translateY(26px) scaleY(1.2);opacity:0}}
.unit.drip .a-tox::after{animation-duration:.4s}
/* 冰冻：一层冰壳 */
.a-ice{background:linear-gradient(135deg,rgba(220,245,255,.55),rgba(140,210,255,.18) 40%,rgba(200,240,255,.45) 60%,rgba(120,190,255,.15));clip-path:polygon(18% 6%,46% 0,78% 8%,96% 34%,92% 72%,74% 98%,30% 100%,6% 78%,2% 38%);border:0;box-shadow:inset 0 0 12px rgba(220,245,255,.8);animation:iGlint 2s ease-in-out infinite}
@keyframes iGlint{50%{filter:brightness(1.35)}}
.unit.st-ice .sp{filter:drop-shadow(0 0 6px #8fd0ff) saturate(.4) brightness(1.15) hue-rotate(170deg)}
/* 眩晕：头顶转金星 */
.a-stun{top:-14px!important;bottom:auto!important;height:20px!important;animation:sSpin 1s linear infinite;transform-style:preserve-3d}
.a-stun b{position:absolute;top:0;left:50%;color:#ffe066;font-size:13px;text-shadow:0 0 6px #ffb02a}
.a-stun b:nth-child(1){transform:translateX(-50%) rotateY(0deg) translateZ(22px)}.a-stun b:nth-child(2){transform:translateX(-50%) rotateY(120deg) translateZ(22px)}.a-stun b:nth-child(3){transform:translateX(-50%) rotateY(240deg) translateZ(22px)}
@keyframes sSpin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
/* 护盾：符箓光罩，挨打出裂纹 */
.a-shd{inset:-14%!important;border-radius:50%;border:2px solid rgba(255,229,138,.75);background:radial-gradient(circle,rgba(255,229,138,0) 55%,rgba(255,229,138,.22) 75%,rgba(255,229,138,.05) 100%);box-shadow:0 0 14px rgba(255,215,90,.45),inset 0 0 14px rgba(255,215,90,.35);animation:shPulse 1.6s ease-in-out infinite}
.a-shd::before{content:"符";position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:#ffd75a;font:900 12px "Noto Serif SC",serif;text-shadow:0 0 6px #c4291f}
@keyframes shPulse{50%{transform:scale(1.04);box-shadow:0 0 22px rgba(255,215,90,.6),inset 0 0 18px rgba(255,215,90,.45)}}
.unit.crack .a-shd{animation:shCrack .32s}
.unit.crack .a-shd::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(62deg,transparent 47%,#fff7d0 48%,transparent 50%),linear-gradient(-30deg,transparent 54%,#fff7d0 55%,transparent 57%),linear-gradient(10deg,transparent 30%,#fff7d0 31%,transparent 33%)}
@keyframes shCrack{0%{filter:brightness(2.2)}100%{filter:none}}
/* 狂暴：脚下一圈红光 */
.a-rage{inset:-20%!important;border-radius:50%;background:radial-gradient(circle,rgba(255,60,30,.35),transparent 65%);animation:rgPulse .7s ease-in-out infinite alternate}
@keyframes rgPulse{to{transform:scale(1.15);opacity:.6}}
/* 摄魂：紫色鬼火绕身 */
.a-cur::before,.a-cur::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#c39cff;box-shadow:0 0 10px 3px rgba(195,156,255,.7);animation:cOrb 1.6s linear infinite}
.a-cur::after{animation-delay:-.8s}
@keyframes cOrb{from{transform:rotate(0) translateX(calc(var(--sz,48px) * .45)) }to{transform:rotate(360deg) translateX(calc(var(--sz,48px) * .45))}}
/* 打击感：被打先白闪；暴击顿一下 */
@keyframes hurt{0%{filter:brightness(3.2) saturate(0)}20%{transform:translateX(-6px);filter:brightness(2.2) sepia(1) hue-rotate(-50deg) saturate(5)}60%{transform:translateX(5px)}}
.arena.hitstop .unit .sp,.arena.hitstop .fx{animation-play-state:paused!important}
/* 首领蓄力：脚下红光、四周泛红、警告条 */
.unit.charging.k-boss::before{content:"";position:absolute;left:50%;bottom:44px;width:180px;height:40px;margin-left:-90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,40,20,.6),rgba(255,40,20,0));animation:rgPulse .45s ease-in-out infinite alternate;z-index:0}
.arena:has(.unit.charging.k-boss)::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px rgba(220,30,20,.45);animation:rgPulse .6s ease-in-out infinite alternate;z-index:5}
.bwarn{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:9;padding:4px 12px;border:1px solid #ff5a3a;background:rgba(60,8,4,.88);color:#ffb08a;font:700 13px "Noto Serif SC",serif;border-radius:4px;white-space:nowrap;animation:bwIn 1.8s ease-out both}
@keyframes bwIn{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* 克制特写：画面一亮一暗 */
.arena.foilflash::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at 50% 35%,rgba(255,230,150,.35),rgba(0,0,0,.55) 70%);animation:ffl .7s ease-out both}
@keyframes ffl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.fx.proj.keyfly img{filter:drop-shadow(0 0 8px #ffd75a)}
.fx.pt.shard{border-radius:1px!important;transform:rotate(45deg)}
.qlog .rvb{min-height:26px;padding:0 8px;font-size:12px;margin-left:6px;vertical-align:middle}

/* ===== 出招动作：站姿呼吸、兵器、刀光、冲击、法阵、残影 ===== */
.unit .pose{position:relative;display:inline-block;width:var(--sz);height:var(--sz);transform-origin:50% 100%;animation:breath var(--bt,2s) ease-in-out infinite;animation-delay:var(--bd,0s)}
.unit .act{position:relative;width:100%;height:100%;transform-origin:50% 100%}
.unit .act>img{display:block}
.unit .wp{position:absolute;left:var(--wx);top:var(--wy);width:var(--ws);height:var(--ws);transform-origin:var(--ox) var(--oy);transform:scaleX(var(--wf)) rotate(var(--wr));animation:wsway var(--bt,2s) ease-in-out infinite;animation-delay:var(--bd,0s);pointer-events:none;z-index:2}
.unit .wp img{display:block;width:100%;height:100%}
@keyframes breath{50%{transform:translateY(-1.5px) scale(1.02,1.03)}}
@keyframes wsway{50%{transform:scaleX(var(--wf)) rotate(calc(var(--wr) - 5deg))}}
.unit.m-float .pose{animation-name:floaty;animation-duration:2.6s}
@keyframes floaty{50%{transform:translateY(-6px)}}
.unit.m-flap .pose{animation-name:flap;animation-duration:.45s}
@keyframes flap{50%{transform:translateY(-3px) scaleX(.84)}}
.unit.k-boss .pose{animation-duration:2.9s}
.unit.dead .pose,.unit.dead .wp,.unit.frozen .pose,.unit.frozen .wp{animation:none}
.fx.arc{width:var(--s);height:var(--s);animation-name:arcsw;filter:drop-shadow(0 0 6px var(--c));mix-blend-mode:screen;z-index:3}
.fx.arc svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes arcsw{from{transform:translate(-50%,-50%) scaleX(var(--f)) rotate(calc(var(--rot) - 75deg)) scale(.7);opacity:0}25%{opacity:1}to{transform:translate(-50%,-50%) scaleX(var(--f)) rotate(calc(var(--rot) + 20deg)) scale(1.1);opacity:0}}
.fx.impact{width:var(--s);height:var(--s);border-radius:50%;background:repeating-conic-gradient(from 7deg,var(--c) 0 4deg,transparent 4deg 24deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 30% 56%,transparent 68%);mask:radial-gradient(circle,transparent 26%,#000 30% 56%,transparent 68%);animation-name:impact;mix-blend-mode:screen}
@keyframes impact{from{transform:translate(-50%,-50%) scale(.35);opacity:1}to{transform:translate(-50%,-50%) scale(1.2) rotate(8deg);opacity:0}}
.fx.mcircle{width:var(--s);height:calc(var(--s) * .32);border-radius:50%;border:2px solid var(--c);box-shadow:0 0 10px var(--c),inset 0 0 10px var(--c);animation-name:mcir;z-index:0}
.fx.mcircle::before{content:"";position:absolute;inset:4px 12px;border-radius:50%;border:2px dashed var(--c);opacity:.85;animation:mspin 1.2s linear infinite}
.fx.mcircle::after{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%)}
@keyframes mcir{from{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{opacity:1}to{transform:translate(-50%,-50%) scale(1.12);opacity:0}}
@keyframes mspin{to{transform:rotate(360deg)}}
.fx.ghostimg{animation-name:gimg;filter:brightness(1.7) drop-shadow(0 0 4px var(--c))}
.fx.ghostimg img{display:block}

(function () {
  var L = ''; try { L = localStorage.getItem('abyss_lang') || ''; } catch (e) {}
  if (L !== 'vi' && L !== 'zh') L = /^vi/i.test(navigator.language || '') ? 'vi' : 'zh';
  window.LANG = L;

})();
